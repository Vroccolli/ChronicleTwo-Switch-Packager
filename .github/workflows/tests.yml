name: Packager tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run installation workflow tests
        run: python -m unittest discover -s scripts/packager -p test_packager.py -v
